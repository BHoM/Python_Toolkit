[project]
name = "python_toolkit"
version = "0.1.0"
description = "The core BHoM Python toolkit environment, containing essential tools and utilities."
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
    { name = "BHoM", email = "bhombot@burohappold.com" }
]
dependencies = [
    "matplotlib",
    "numpy", 
    "pandas",
    "plotly",
    "pythonnet",
    "pytz", 
    "pywin32; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "flask",
    "furo",
    "interrogate",
    "ipykernel",
    "line-profiler",
    "memory-profiler",
    "mypy",
    "pydata-sphinx-theme",
    "pydocstyle",
    "pylint",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-dependency",
    "pytest-xdist",
    "pytest",
    "ruff",
    "sphinx-bootstrap-theme",
    "sphinx",
    "sphinx-autoapi",
    "sphinxcontrib-fulltoc",
    "sphinxcontrib-napoleon"
]
